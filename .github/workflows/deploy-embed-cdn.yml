name: Deploy Embed to CDN

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Dry run (build and show upload plan without uploading)'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.3'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build SDK dependencies
        run: bunx turbo build --filter=@userplane/sdk^...

      - name: Build metadata (CDN)
        run: cd packages/metadata && bun run build:cdn

      - name: Build SDK (CDN)
        run: cd packages/sdk && SDK_RECORDER_BASE_URL=https://recorder.userplane.io SDK_VERIFICATION_BASE_URL=https://api.userplane.io/api/v1 bun run build:cdn

      - name: Build embed (CDN)
        run: cd packages/embed && CDN_DOMAIN=https://cdn.userplane.io R2_CDN_PREFIX=embed bun run build:cdn

      - name: Upload (dry run)
        if: inputs.dry-run
        run: cd packages/embed && bun run upload:cdn --dry-run --verbose
        env:
          R2_CDN_ACCOUNT_ID: ${{ secrets.R2_CDN_ACCOUNT_ID }}
          R2_CDN_ACCESS_KEY_ID: ${{ secrets.R2_CDN_ACCESS_KEY_ID }}
          R2_CDN_SECRET_ACCESS_KEY: ${{ secrets.R2_CDN_SECRET_ACCESS_KEY }}
          R2_CDN_BUCKET_NAME: ${{ secrets.R2_CDN_BUCKET_NAME }}
          CDN_DOMAIN: https://cdn.userplane.io
          R2_CDN_PREFIX: embed

      - name: Upload
        if: ${{ !inputs.dry-run }}
        run: cd packages/embed && bun run upload:cdn --verbose
        env:
          R2_CDN_ACCOUNT_ID: ${{ secrets.R2_CDN_ACCOUNT_ID }}
          R2_CDN_ACCESS_KEY_ID: ${{ secrets.R2_CDN_ACCESS_KEY_ID }}
          R2_CDN_SECRET_ACCESS_KEY: ${{ secrets.R2_CDN_SECRET_ACCESS_KEY }}
          R2_CDN_BUCKET_NAME: ${{ secrets.R2_CDN_BUCKET_NAME }}
          CDN_DOMAIN: https://cdn.userplane.io
          R2_CDN_PREFIX: embed

      - name: Git tag
        if: ${{ !inputs.dry-run }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "embed-cdn@${SHORT_SHA}"
          git push origin "embed-cdn@${SHORT_SHA}"
